<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam | SmartExam</title>
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/exam.css" />
  </head>
  <body>
    <header class="topbar"><div class="container nav"><a class="brand" href="/">SmartExam</a><div class="exam-timer" data-timer>--:--</div></div></header>
    <main class="exam-shell container">
      <section class="exam-heading"><div><p class="eyebrow">Live assessment</p><h1 data-exam-title>Loading exam...</h1><p data-exam-meta></p></div></section>
      <p class="dashboard-status" data-exam-status aria-live="polite"></p>
      <form class="question-list" data-question-list></form>
      <div class="submit-area"><button class="btn primary" type="button" data-submit>Submit exam</button></div>
      <section class="result-panel" data-result hidden><p class="eyebrow">Assessment complete</p><h2 data-result-title>Result</h2><p data-result-summary></p><a class="btn primary" href="/">Back to dashboard</a></section>
    </main>
    <script src="./js/exam.js"></script>
  </body>
</html>
