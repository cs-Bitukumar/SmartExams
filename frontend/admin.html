<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | SmartExam</title>
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/dashboard.css" />
    <link rel="stylesheet" href="./css/admin.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <a class="brand" href="/admin.html">SmartExam Admin</a>
        <nav><a href="/">Student view</a><button class="nav-button" type="button" data-logout>Logout</button></nav>
      </div>
    </header>
    <main class="dashboard container">
      <section class="dashboard-header"><div><p class="eyebrow">Administration</p><h1>Control center</h1><p class="dashboard-subtitle">Monitor exams, students, and assessment activity.</p></div></section>
      <p class="dashboard-status" data-admin-status aria-live="polite"></p>
      <section class="stat-grid admin-stats">
        <article class="stat-card"><span>Total students</span><strong data-stat="totalStudents">0</strong></article>
        <article class="stat-card"><span>Total exams</span><strong data-stat="totalExams">0</strong></article>
        <article class="stat-card"><span>Published exams</span><strong data-stat="publishedExams">0</strong></article>
        <article class="stat-card"><span>Total attempts</span><strong data-stat="totalAttempts">0</strong></article>
      </section>
      <section class="admin-form-section">
        <div class="section-heading"><h2>Create exam</h2><span>Set up a new assessment</span></div>
        <form class="admin-form" data-exam-form>
          <label>Title<input name="title" required /></label>
          <label>Subject<input name="subject" required /></label>
          <label class="wide">Description<textarea name="description" rows="2" required></textarea></label>
          <label>Duration (minutes)<input type="number" name="duration" min="1" required /></label>
          <label>Total marks<input type="number" name="totalMarks" min="1" required /></label>
          <label>Passing marks<input type="number" name="passingMarks" min="0" required /></label>
          <label>Status<select name="status"><option value="draft">Draft</option><option value="published">Published</option></select></label>
          <button class="btn primary" type="submit">Create exam</button>
        </form>
      </section>
      <section class="dashboard-section"><div class="section-heading"><h2>Exams</h2><span data-exam-count>0 exams</span></div><div class="admin-table" data-exam-list></div></section>
      <section class="dashboard-section"><div class="section-heading"><h2>Students</h2><span data-user-count>0 students</span></div><div class="admin-table" data-user-list></div></section>
    </main>
    <script src="./js/admin.js"></script>
  </body>
</html>
